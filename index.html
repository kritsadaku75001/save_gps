<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- กำหนด Content Security Policy เพื่อความปลอดภัย -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://script.google.com; style-src 'self' 'unsafe-inline';">
  <title>บันทึกกิจกรรมและตำแหน่ง GPS</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; background-color: #f9f9f9; }
    h2 { color: #333; text-align: center; }
    label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
    textarea, input[type="number"] { width: 100%; margin-top: 5px; padding: 12px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; margin-top: 20px; padding: 14px; box-sizing: border-box; font-size: 16px; background-color: #04AA6D; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:active { background-color: #038e5b; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #status { margin-top: 20px; text-align: center; font-weight: bold; color: #d9534f; }
  </style>
</head>
<body>
  <h2>บันทึกกิจกรรมและตำแหน่ง</h2>
  
  <label for="activity">กิจกรรมที่กำลังทำ:</label>
  <textarea id="activity" rows="4" maxlength="500" placeholder="ระบุรายละเอียดงานที่กำลังทำ..."></textarea>
  
  <!-- ช่องกรอกจำนวนถังขยะ -->
  <label for="binCount">จำนวนถังขยะ (ใบ):</label>
  <input type="number" id="binCount" min="1" value="1" placeholder="ระบุจำนวนถังขยะ...">

  <button id="submitBtn" onclick="submitData()">ส่งข้อมูลพร้อมพิกัด GPS</button>
  <div id="status"></div>

  <script>
    function isValidLatLon(lat, lon) {
      return typeof lat === 'number' && !isNaN(lat) && lat >= -90 && lat <= 90 &&
             typeof lon === 'number' && !isNaN(lon) && lon >= -180 && lon <= 180;
    }

    function submitData() {
      var actInput = document.getElementById('activity');
      var binCountInput = document.getElementById('binCount');
      var statusDiv = document.getElementById('status');
      var submitBtn = document.getElementById('submitBtn');
      
      var act = actInput.value.trim();
      var binCount = binCountInput.value.trim();
      
      if (!act) {
        alert("กรุณากรอกรายละเอียดกิจกรรมก่อนครับ");
        return;
      }

      if (!binCount || Number(binCount) <= 0) {
        alert("กรุณากรอกจำนวนถังขยะให้ถูกต้อง");
        return;
      }

      submitBtn.disabled = true;
      statusDiv.style.color = "#0275d8";
      statusDiv.innerText = "กำลังดึงพิกัด GPS...";
      
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          statusDiv.innerText = "กำลังบันทึกลง Google Sheets...";
          
          var lat = Number(pos.coords.latitude);
          var lon = Number(pos.coords.longitude);

          if (!isValidLatLon(lat, lon)) {
            statusDiv.style.color = "#d9534f";
            statusDiv.innerText = "เกิดข้อผิดพลาด: พิกัด GPS ไม่ถูกต้อง";
            submitBtn.disabled = false;
            return;
          }
          
          var scriptUrl = "https://script.google.com/macros/s/AKfycbwne2uHjQXbgumMeuqlwTBBO_dHk2foPtLRQ46uRYTuVuEydSY0Vhz_lPJEOCKYRVG_/exec";
          
          // ส่งข้อมูลแบบ POST แยกตัวแปร lat และ lon ออกจากกัน รวมถึงจำนวนถังขยะ (binCount)
          var payload = new URLSearchParams();
          payload.append('activity', act);
          payload.append('binCount', binCount);
          payload.append('lat', lat);
          payload.append('lon', lon);

          fetch(scriptUrl, {
            method: 'POST',
            body: payload
          })
            .then(response => response.text())
            .then(res => {
              statusDiv.style.color = "#04AA6D";
              statusDiv.innerText = "บันทึกข้อมูลเรียบร้อยแล้ว!";
              actInput.value = '';
              binCountInput.value = '1';
              submitBtn.disabled = false;
            })
            .catch(err => {
              statusDiv.style.color = "#d9534f";
              statusDiv.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
              submitBtn.disabled = false;
            });
            
        }, function(err) {
          statusDiv.style.color = "#d9534f";
          statusDiv.innerText = "ไม่สามารถดึง GPS ได้: กรุณาเปิด Location ในมือถือ";
          submitBtn.disabled = false;
        }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
      } else {
        statusDiv.style.color = "#d9534f";
        statusDiv.innerText = "เบราว์เซอร์นี้ไม่รองรับ GPS";
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
